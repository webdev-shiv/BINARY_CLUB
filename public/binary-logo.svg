<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Left Vertical Dark Bar with BINARY text -->
  <rect x="20" y="20" width="38" height="160" fill="#2B3245" rx="3"/>
  <text x="39" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">B</text>
  <text x="39" y="68" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">I</text>
  <text x="39" y="92" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">N</text>
  <text x="39" y="116" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">A</text>
  <text x="39" y="140" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">R</text>
  <text x="39" y="164" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle">Y</text>

  <!-- Outer B Outline Group -->
  <!-- Top Loop Outer -->
  <path d="M 58 20 L 118 20 A 40 40 0 0 1 118 100 L 58 100 Z" fill="#FFFFFF" stroke="#2B3245" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M 118 20 A 40 40 0 0 1 118 100 L 118 20 Z" fill="#E54335" stroke="#2B3245" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- Bottom Loop Outer -->
